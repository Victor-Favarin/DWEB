<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Controle de Estoque - Mercadinho</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="pagina-estoque">
    <header class="cabecalho cor-estoque">
        <div class="cabecalho-interno"><a class="voltar" href="../html/dashboard.html">←</a>
            <div>
                <h1>Controle de Estoque</h1>
                <p id="contador">0 produtos cadastrados</p>
            </div>
        </div>
    </header>
    <main>
        <div class="resumo-grid">
            <div class="resumo normal"><span>✓</span><strong id="totalNormal">0</strong><b>Normal</b></div>
            <div class="resumo baixo-est"><span>⚠</span><strong id="totalBaixo">0</strong><b>Estoque Baixo</b></div>
            <div class="resumo sem-est"><span>⊗</span><strong id="totalSem">0</strong><b>Sem Estoque</b></div>
        </div>
        <div class="botoes-estoque"><button class="btn btn-verde" data-tipo="entrada">↗ Entrada de
                Produtos</button><button class="btn btn-saida" data-tipo="saida">↘ Saída de Produtos</button><button
                class="btn btn-azul" data-tipo="ajuste">⟳ Ajuste de Estoque</button></div>
        <section class="painel-form" id="painel" hidden>
            <div class="painel-titulo" id="painelTitulo">
                <h2 id="titulo">Entrada de Produtos</h2><button id="fechar" class="botao-fechar">×</button>
            </div>
            <form id="formMov">
                <div class="campo"><label for="produto">Produto *</label><select id="produto" required></select></div>
                <div class="grade">
                    <div class="campo"><label for="quantidade" id="labelQtd">Quantidade *</label><input type="number"
                            id="quantidade" min="1" step="1" required placeholder="0"><small id="ajudaQtd"
                            hidden>Informe a quantidade total que deve ficar no estoque.</small></div>
                    <div class="campo" id="campoFornecedor"><label for="fornecedor">Fornecedor</label><select
                            id="fornecedor"></select></div>
                </div>
                <div class="campo"><label for="observacao">Motivo / Observação</label><input id="observacao"
                        placeholder="Ex: Compra do fornecedor, avaria, inventário..."></div>
                <p class="erro" id="erro"></p>
                <div class="rodape"><button type="submit" class="btn btn-verde" id="confirmar">✓ Confirmar
                        Entrada</button><button type="button" class="btn btn-cinza" id="cancelar">✕ Cancelar</button>
                </div>
            </form>
        </section>
        <div class="barra busca-larga"><input id="busca" placeholder="⌕  Buscar por nome, código ou categoria..."></div>
        <div class="tabela-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Categoria</th>
                        <th>Qtd. Atual</th>
                        <th>Qtd. Mínima</th>
                        <th>Localização</th>
                        <th>Situação</th>
                    </tr>
                </thead>
                <tbody id="lista"></tbody>
            </table>
        </div>
        <p class="dica">Clique em um produto para registrar sua saída.</p>
    </main>
    <script src="../js/dados.js"></script>
    <script src="../js/estoque.js"></script>
</body>

</html>
